# controller_manager runs inside the Gazebo server process, loaded by
# gz_ros2_control. update_rate is the control loop frequency; the gait node
# publishes at 100 Hz, so 200 Hz here leaves headroom without starving the
# physics step.
controller_manager:
  ros__parameters:
    update_rate: 200

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    leg_position_controller:
      type: position_controllers/JointGroupPositionController

    head_position_controller:
      type: position_controllers/JointGroupPositionController

    tail_position_controller:
      type: position_controllers/JointGroupPositionController

leg_position_controller:
  ros__parameters:
    # ORDER IS A CONTRACT. robot_cat_gait.gait_controller packs its
    # Float64MultiArray in exactly this order (see JOINT_ORDER there).
    joints:
      - fl_hip_joint
      - fl_thigh_joint
      - fl_calf_joint
      - fr_hip_joint
      - fr_thigh_joint
      - fr_calf_joint
      - rl_hip_joint
      - rl_thigh_joint
      - rl_calf_joint
      - rr_hip_joint
      - rr_thigh_joint
      - rr_calf_joint

head_position_controller:
  ros__parameters:
    # ORDER IS A CONTRACT. robot_cat_teleop.keyboard_teleop packs [pan, tilt].
    joints:
      - neck_pan_joint
      - head_tilt_joint

tail_position_controller:
  ros__parameters:
    joints:
      - tail_joint

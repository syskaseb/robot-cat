<text x="70" y="454">Rzut XY: obie opaski przed kolumną; FR_P bez zmian.</text><text x="555" y="110">Odebrane:</text><text x="555" y="143">root kolumny: 48 mm³</text><text x="555" y="174">stopa → górny powrót: 108 mm³</text><text x="555" y="205">łożysko: 104 mm², intrusion 0</text><text x="555" y="236">prowadzenie / kanał: 0,2 mm</text><text x="555" y="267">obrys: min 3,7 ≥ 3,25 mm</text><text x="555" y="298">2 niezależne pełne T18I100</text><text x="555" y="329">100 mm capacity reszty KAŻDEJ tej samej opaski</text><text x="555" y="360">to rezerwa przestrzeni, nie dodatkowy materiał.</text><text x="555" y="406">SOURCE + U1–MODULE + JPWM + S0</text><text x="555" y="433">pozostają na swoich miejscach.</text><text x="24" y="492">OPEN: S0 mocowanie, 4 zależności elastyczne wejścia, capacity2 / R6 / invalid3, cały N01.</text></g></svg>

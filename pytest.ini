# RoboStack's launch_testing / launch_testing_ros ship pytest hooks written
# against an older pytest than the one in this environment, so simply importing
# them aborts collection with a PluginValidationError. Nothing here uses
# launch_testing, so disable both plugins globally.
[pytest]
addopts = -p no:launch_testing -p no:launch_ros
testpaths = src
# Lets the pure-maths tests run straight from the source tree, without needing
# a colcon build + source first.
pythonpath = src/robot_cat_gait src/robot_cat_teleop
